version: '3.8'

services:
  app:
    build: .
    container_name: vaga-app
    ports:
      - "9000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: vaga-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: vagas_db
      MYSQL_USER: wesley
      MYSQL_PASSWORD: wesley123
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
