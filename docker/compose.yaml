services:
  mysql:
    image: mysql:8.4
    container_name: teste2-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: teste2
      MYSQL_USER: renato
      MYSQL_PASSWORD: renato123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
